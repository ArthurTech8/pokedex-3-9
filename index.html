<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pokedex</h1>
    </header>

    <main class="lista-pokemons">
        <div class="busca">

            <input
                type="text"
                id="inputBusca"
                placeholder="Digite o nome do Pokémon"
            >

            <button id="btnBuscar">
                Buscar
            </button>

        </div>
        
        <div id="listaPokemons"></div>

        <div class="paginacao" id="paginacao">

            <button id="btnAnterior">
                Anterior
            </button>

            <span id="paginaAtual">
                Página 1
            </span>

            <button id="btnProximo">
                Próxima
            </button>

        </div>

        <div id="modalErro" class="modal">

            <div class="modal-content">

                <h2>Ops!</h2>

                <p id="mensagemErro">
                    Pokémon não encontrado.
                </p>

                <button id="fecharModal">
                    Fechar
                </button>
            </div>

</div>
    </main>

    <script src="./script.js"></script>
</body>

</html>
